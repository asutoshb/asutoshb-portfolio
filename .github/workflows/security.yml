name: Security Scan

# Diff-aware: runs on pull requests and reports ONLY what the PR changed.
# A base branch is required to diff against, so this workflow is PR-only.
on:
  pull_request:
    branches: ["**"]

# One lane per PR: a new commit to the same PR cancels the previous
# still-running scan. Keyed by PR number so it stays stable across every
# `synchronize` event (github.ref for pull_request is refs/pull/N/merge,
# which is already stable, but PR number is the clearest key).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 1. Gitleaks - scans the commits introduced by THIS PR for hard-coded
  #    secrets (API keys, tokens, passwords, private keys, etc.)
  # ------------------------------------------------------------------
  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan every commit

      # Run the gitleaks binary so we can scope the scan to the PR's commit
      # range (base..HEAD) instead of the whole repo.
      - name: Install Gitleaks
        run: |
          VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # continue-on-error so the summarize step always runs; it re-exits 1
      # when secrets are found, keeping the job red.
      - name: Scan PR changes only
        id: gitleaks
        continue-on-error: true
        env:
          # PR base commit, passed via env (never interpolated into the shell
          # body) to avoid injection. It is an ancestor of HEAD thanks to
          # fetch-depth: 0, so no extra fetch is needed.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # --redact keeps secret VALUES out of logs/artifacts.
          # --log-opts limits the scan to commits introduced by THIS PR
          # (base..HEAD), so only secrets the PR adds are reported.
          gitleaks detect \
            --source . \
            --log-opts="${BASE_SHA}..HEAD" \
            --report-format json \
            --report-path gitleaks.json \
            --redact \
            --no-banner

      - name: Summarize findings
        if: always()
        run: |
          if [ ! -f gitleaks.json ]; then
            echo "### ⚠️ Gitleaks — scanner crashed (no report produced)" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the 'Scan PR changes only' step logs for details." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -s gitleaks.json ] && [ "$(jq 'length' gitleaks.json)" != "0" ]; then
            echo "## 🛑 Gitleaks detected secrets 🛑" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| File | Rule | Line |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            # Dedupe: git-log mode reports one hit per secret PER COMMIT, so the
            # same secret repeats across the PR's commits. Collapse by File+Rule
            # (values are redacted, so the secret itself can't be the key) and
            # keep the smallest line number seen for a stable, single row each.
            jq -r '
              group_by(.File + "|" + .RuleID)
              | map({File: .[0].File, RuleID: .[0].RuleID, Line: (map(.StartLine) | min)})
              | .[]
              | "| \(.File) | \(.RuleID) | \(.Line) |"
            ' gitleaks.json >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> Values are redacted. Rotate any real secret immediately and remove it from git history." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "## ✅ Gitleaks — no secrets detected" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ------------------------------------------------------------------
  # 2. Semgrep - static analysis for insecure code patterns
  #    (SQLi, XSS, command injection, weak crypto, dangerouslySetInnerHTML, etc.)
  # ------------------------------------------------------------------
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history so --baseline-commit can diff the PR

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install --quiet semgrep

      # `semgrep scan` with --baseline-commit reports ONLY findings introduced
      # by this PR (compared against the PR base). No platform token needed.
      # continue-on-error so the summarize step always runs; it re-exits 1
      # when findings are present, keeping the job red.
      - name: Run Semgrep (PR changes only)
        id: semgrep
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan \
            --config p/default \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --config p/owasp-top-ten \
            --baseline-commit "${BASE_SHA}" \
            --json --output=semgrep.json \
            --quiet

      # Build a run-page summary table from the JSON, mirroring the Gitleaks
      # table. Runs even when the scan step fails thanks to `if: always()`.
      - name: Summarize findings
        if: always()
        run: |
          if [ ! -f semgrep.json ]; then
            echo "## ⚠️ Semgrep — scanner crashed (no report produced)" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the 'Run Semgrep' step logs for details." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          COUNT=$(jq '.results | length' semgrep.json)
          if [ "$COUNT" != "0" ]; then
            echo "## 🛑 Semgrep detected issues 🛑" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| File | Line | Severity | Rule | Message |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.results[] | "| \(.path) | \(.start.line) | \(.extra.severity) | \(.check_id | split(".") | last) | \(.extra.message | gsub("[\\r\\n|]"; " ")) |"' semgrep.json >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "## ✅ Semgrep — no issues detected" >> "$GITHUB_STEP_SUMMARY"
          fi
