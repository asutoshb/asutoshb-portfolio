name: Security Scan

# Diff-aware: runs on pull requests and reports ONLY what the PR changed.
# A base branch is required to diff against, so this workflow is PR-only.
on:
  pull_request:
    branches: ["**"]

# One lane per PR: a new commit to the same PR cancels the previous
# still-running scan. Keyed by PR number so it stays stable across every
# `synchronize` event (github.ref for pull_request is refs/pull/N/merge,
# which is already stable, but PR number is the clearest key).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # allows uploading SARIF to the Security tab
  pull-requests: read

jobs:
  # ------------------------------------------------------------------
  # 1. Gitleaks - scans the commits introduced by THIS PR for hard-coded
  #    secrets (API keys, tokens, passwords, private keys, etc.)
  # ------------------------------------------------------------------
  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan every commit

      # Run the gitleaks binary so we can scope the scan to the PR's commit
      # range (base..HEAD) instead of the whole repo.
      - name: Install Gitleaks
        run: |
          VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # continue-on-error so the summarize step always runs; it re-exits 1
      # when secrets are found, keeping the job red.
      - name: Scan PR changes only
        id: gitleaks
        continue-on-error: true
        env:
          # PR base commit, passed via env (never interpolated into the shell
          # body) to avoid injection. It is an ancestor of HEAD thanks to
          # fetch-depth: 0, so no extra fetch is needed.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # --redact keeps secret VALUES out of logs/artifacts.
          # --log-opts limits the scan to commits introduced by THIS PR
          # (base..HEAD), so only secrets the PR adds are reported.
          gitleaks detect \
            --source . \
            --log-opts="${BASE_SHA}..HEAD" \
            --report-format json \
            --report-path gitleaks.json \
            --redact \
            --no-banner

      - name: Summarize findings
        if: always()
        run: |
          if [ ! -f gitleaks.json ]; then
            echo "### ⚠️ Gitleaks — scanner crashed (no report produced)" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the 'Scan PR changes only' step logs for details." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -s gitleaks.json ] && [ "$(jq 'length' gitleaks.json)" != "0" ]; then
            echo "## 🛑 Gitleaks detected secrets 🛑" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| File | Rule | Line |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "| \(.File) | \(.RuleID) | \(.StartLine) |"' gitleaks.json >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> Values are redacted. Rotate any real secret immediately and remove it from git history." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "## ✅ Gitleaks — no secrets detected" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ------------------------------------------------------------------
  # 2. Semgrep - static analysis for insecure code patterns
  #    (SQLi, XSS, command injection, weak crypto, dangerouslySetInnerHTML, etc.)
  # ------------------------------------------------------------------
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history so --baseline-commit can diff the PR

      # `semgrep scan` with --baseline-commit reports ONLY findings introduced
      # by this PR (compared against the PR base). No platform token needed.
      # --error makes the job FAIL (red X) when a new finding is detected.
      - name: Run Semgrep (PR changes only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan \
            --config p/default \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --config p/owasp-top-ten \
            --baseline-commit "${BASE_SHA}" \
            --sarif --output=semgrep.sarif \
            --error

      # Build a run-page summary table from the SARIF, mirroring the
      # table the Gitleaks action prints. Runs even when the scan step
      # fails (findings present) thanks to `if: always()`.
      - name: Semgrep summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os

          summary = os.environ["GITHUB_STEP_SUMMARY"]

          def write(text):
              with open(summary, "a") as f:
                  f.write(text)

          # If the report is missing/corrupt the scanner crashed - surface it
          # loudly instead of silently reporting "no issues" (a false all-clear).
          if not os.path.exists("semgrep.sarif"):
              write("## ⚠️ Semgrep - scanner crashed (no report produced)\n\n")
              write("Check the 'Run Semgrep' step logs for details.\n")
              raise SystemExit(0)
          try:
              data = json.load(open("semgrep.sarif"))
          except Exception as e:
              write(f"## ⚠️ Semgrep - could not parse report ({e})\n")
              raise SystemExit(0)

          rows = []
          for run in data.get("runs", []):
              for r in run.get("results", []):
                  rule = r.get("ruleId", "")
                  level = r.get("level", "warning")
                  msg = (r.get("message", {}).get("text", "") or "").splitlines()[0]
                  loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                  uri = loc.get("artifactLocation", {}).get("uri", "")
                  line = loc.get("region", {}).get("startLine", "")
                  rows.append((rule, level, uri, line, msg))
          if rows:
              write("## 🛑 Semgrep detected issues 🛑\n\n")
              write("| Rule ID | Severity | File | Line | Message |\n")
              write("|---|---|---|---|---|\n")
              for rule, level, uri, line, msg in rows:
                  write(f"| `{rule}` | {level} | {uri} | {line} | {msg} |\n")
          else:
              write("## ✅ Semgrep found no issues\n")
          PY

      - name: Upload Semgrep results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
